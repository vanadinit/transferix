[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transferix"
version = "4.0.0"
requires-python = ">=3.10"
dependencies = [
    "Flask",
    "pynacl",
    "werkzeug",
]

[project.optional-dependencies]
tests = ["flake8", "pytest"]
qr = ["qrcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["transferix"]

[tool.setuptools.package-data]
transferix = ["static/*"]
